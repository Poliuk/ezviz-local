# Push a tag like v0.1.1 to publish that version on npm. Trusted publishing
# (OIDC): no npm token is stored anywhere, and npm records provenance linking
# the release to this repository and workflow.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use a current npm (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@latest
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm test
      - run: npm publish
